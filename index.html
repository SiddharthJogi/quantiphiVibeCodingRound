<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker & Renewal Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-surface: rgba(18, 24, 38, 0.9);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-blue: #3b82f6;
            --caution-amber: #f59e0b;
            --caution-amber-bg: rgba(245, 158, 11, 0.15);
            --danger-red: #ef4444;
            --danger-red-bg: rgba(239, 68, 68, 0.15);
            --radius-md: 10px;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1, h2 {
            font-weight: 600;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .metric-card {
            background: var(--bg-surface);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .metric-title {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .value-amber {
            color: var(--caution-amber);
        }

        .dashboard-section {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            align-items: start;
        }

        .form-container {
            background: var(--bg-surface);
            padding: 1.5rem;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        input, select {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button.primary-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        
        button.primary-btn:hover {
            opacity: 0.9;
        }

        .table-container {
            background: var(--bg-surface);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
            background: rgba(0,0,0,0.2);
        }

        .row-paused {
            opacity: 0.45;
            filter: grayscale(80%);
            transition: all 0.3s;
        }

        .row-paused .service-cost {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .badge-renewing-soon {
            background: var(--caution-amber-bg);
            color: var(--caution-amber);
            border-radius: var(--radius-md);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-overdue {
            background: var(--danger-red-bg);
            color: var(--danger-red);
            border-radius: var(--radius-md);
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Renewal Dashboard</h1>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">Monthly Cash-Flow Burn</div>
                <div class="metric-value">$<span id="burnRate">0.00</span></div>
            </div>
            <div class="metric-card">
                <div class="metric-title">Renewals in Next 7 Days</div>
                <div class="metric-value" id="renewalsCountContainer"><span id="renewalsCount">0</span></div>
            </div>
        </div>

        <div class="dashboard-section">
            <div class="form-container">
                <h2>Add Subscription</h2>
                <form id="subForm">
                    <div class="form-group">
                        <label>Service Name</label>
                        <input type="text" id="serviceName" required minlength="1" maxlength="100" placeholder="e.g. Netflix">
                    </div>
                    <div class="form-group">
                        <label>Cost</label>
                        <input type="number" id="cost" step="0.01" min="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Billing Cycle</label>
                        <select id="billingCycle" required>
                            <option value="MONTHLY">Monthly</option>
                            <option value="YEARLY">Yearly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Next Renewal Date</label>
                        <input type="date" id="renewalDate" required>
                    </div>
                    <button type="submit" class="primary-btn">Add Service</button>
                </form>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Service</th>
                            <th>Cost</th>
                            <th>Cycle</th>
                            <th>Monthly Equiv</th>
                            <th>Next Renewal</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="subTableBody">
                        <!-- Rows populated via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/subscriptions';

        async function fetchSubscriptions() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                
                updateMetrics(data.metrics);
                renderTable(data.subscriptions);
            } catch (err) {
                console.error("Error fetching subscriptions:", err);
            }
        }

        function updateMetrics(metrics) {
            document.getElementById('burnRate').textContent = metrics.total_monthly_burn_rate.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            const rc = document.getElementById('renewalsCount');
            const rcContainer = document.getElementById('renewalsCountContainer');
            rc.textContent = metrics.upcoming_renewals_count;
            
            if (metrics.upcoming_renewals_count > 0) {
                rcContainer.classList.add('value-amber');
            } else {
                rcContainer.classList.remove('value-amber');
            }
        }

        function renderTable(subscriptions) {
            const tbody = document.getElementById('subTableBody');
            tbody.innerHTML = '';
            
            subscriptions.forEach(sub => {
                const tr = document.createElement('tr');
                tr.id = `row-${sub.id}`;
                if (sub.status === 'PAUSED') tr.classList.add('row-paused');

                // Determine badge
                let badgeHTML = '';
                if (sub.is_overdue) {
                    badgeHTML = `<span class="badge-overdue">Overdue</span>`;
                } else if (sub.is_renewing_soon) {
                    badgeHTML = `<span class="badge-renewing-soon">Renewing Soon</span>`;
                }

                tr.innerHTML = `
                    <td><strong>${sub.service_name}</strong></td>
                    <td class="service-cost">$${sub.cost.toFixed(2)}</td>
                    <td>${sub.billing_cycle === 'MONTHLY' ? 'Mo' : 'Yr'}</td>
                    <td>$${sub.normalized_monthly_cost.toFixed(2)}</td>
                    <td>
                        <div>${sub.next_renewal_date}</div>
                        <div style="margin-top: 4px;">${badgeHTML}</div>
                    </td>
                    <td>${sub.status}</td>
                    <td>
                        <label class="toggle-switch">
                            <input type="checkbox" ${sub.status === 'ACTIVE' ? 'checked' : ''} onchange="toggleSubscription('${sub.id}', this)">
                            <span class="slider"></span>
                        </label>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleSubscription(id, checkbox) {
            const row = document.getElementById(`row-${id}`);
            
            // Optimistic update
            if (checkbox.checked) {
                row.classList.remove('row-paused');
            } else {
                row.classList.add('row-paused');
            }

            try {
                const res = await fetch(`${API_URL}/${id}/toggle`, {
                    method: 'PATCH'
                });
                
                if (res.ok) {
                    const data = await res.json();
                    updateMetrics(data.metrics);
                    // Optionally refetch to ensure source of truth
                    fetchSubscriptions();
                } else {
                    // Revert on failure
                    checkbox.checked = !checkbox.checked;
                    if (checkbox.checked) row.classList.remove('row-paused');
                    else row.classList.add('row-paused');
                    alert("Failed to toggle subscription.");
                }
            } catch (err) {
                console.error(err);
                // Revert on failure
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) row.classList.remove('row-paused');
                else row.classList.add('row-paused');
            }
        }

        document.getElementById('subForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                service_name: document.getElementById('serviceName').value,
                cost: parseFloat(document.getElementById('cost').value),
                billing_cycle: document.getElementById('billingCycle').value,
                next_renewal_date: document.getElementById('renewalDate').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    document.getElementById('subForm').reset();
                    fetchSubscriptions();
                } else {
                    const error = await res.json();
                    alert("Error: " + JSON.stringify(error));
                }
            } catch (err) {
                console.error(err);
                alert("Error creating subscription.");
            }
        });

        fetchSubscriptions();
    </script>
</body>
</html>
